<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumora Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; background: #f8f7f4; }
        .post-card {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .post-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.2);
        }
        .post-card img {
            transition: transform 0.6s ease;
        }
        .post-card:hover img {
            transform: scale(1.08);
        }
        .section-header {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }
    </style>
</head>
<body class="bg-[#f8f7f4] text-zinc-900">
    <!-- Header -->
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-9 h-9 bg-zinc-900 rounded-2xl flex items-center justify-center">
                    <span class="text-white font-bold text-2xl">L</span>
                </div>
                <span class="font-bold text-3xl tracking-tighter">Lumora Journal</span>
            </div>

            <div class="w-80">
                <input id="search-input" type="text" placeholder="Search stories..." 
                       class="w-full border border-zinc-300 rounded-full px-5 py-2.5 text-sm focus:outline-none">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-6 pt-10">
        <div class="mb-8">
            <span class="text-xs tracking-[3px] text-zinc-500">THE ARCHIVE</span>
            <h1 class="section-header tracking-tighter">Stories</h1>
        </div>

        <!-- Filters -->
        <div class="flex flex-wrap gap-2 mb-8" id="category-filters"></div>

        <!-- Posts Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-7" id="posts-grid"></div>
    </div>

    <script>
        // 18 Unique Posts
        let posts = [
            { id: 1, title: "The Weight of Silence in Episode 3", excerpt: "Why we chose 47 seconds of pure silence and how it broke everyone.", category: "Behind the Scenes", date: "July 14, 2026", readTime: "14 min", image: "https://picsum.photos/id/1015/900/600", content: "In the writers’ room we fought for three hours. In the end we removed the line completely. The silence became the most powerful moment." },
            { id: 2, title: "Why We Left the Love Unfinished", excerpt: "The deliberate choice that defined our entire series from the first episode.", category: "Storytelling", date: "July 10, 2026", readTime: "11 min", image: "https://picsum.photos/id/160/900/600", content: "We could have given closure. We chose longing instead. That ache is what makes the story live forever." },
            { id: 3, title: "Turkish Drama Meets Pakistani Soul", excerpt: "How two completely different storytelling traditions created something brand new.", category: "Culture", date: "July 12, 2026", readTime: "12 min", image: "https://picsum.photos/id/201/900/600", content: "Turkish poetry met the raw emotional weight of South Asian family stories. The result was honest and unforgettable." },
            { id: 4, title: "Writing Characters That Refuse to Be Liked", excerpt: "The art of creating complicated, difficult, and deeply human characters.", category: "Craft", date: "July 8, 2026", readTime: "9 min", image: "https://picsum.photos/id/1005/900/600", content: "We don’t write perfect people. We write people carrying things they don’t know how to put down." },
            { id: 5, title: "The Color Theory of Longing", excerpt: "How we use light and color as our second language to tell emotional truth.", category: "Visual Storytelling", date: "July 5, 2026", readTime: "8 min", image: "https://picsum.photos/id/251/900/600", content: "Warm tones for memory. Cold shadows for the present they can’t escape. Color became our most honest tool." },
            { id: 6, title: "The Night We Cried in the Editing Room", excerpt: "The raw moment when the story became too real for everyone in the room.", category: "Behind the Scenes", date: "July 3, 2026", readTime: "7 min", image: "https://picsum.photos/id/29/900/600", content: "We stopped the timeline. No one spoke for almost a minute. We all knew this scene was too honest to cut." },
            { id: 7, title: "Love That Destroys and Rebuilds", excerpt: "Writing romance that actually changes who the characters become.", category: "Storytelling", date: "June 30, 2026", readTime: "10 min", image: "https://picsum.photos/id/160/900/600", content: "Easy love is forgettable. The kind that breaks people and then puts them back together." },
            { id: 8, title: "Building Tension Without Explosions", excerpt: "The slow-burn technique that makes silence louder than any scream.", category: "Craft", date: "June 28, 2026", readTime: "8 min", image: "https://picsum.photos/id/201/900/600", content: "We learned that the most powerful tension lives in what is not said between family members." },
            { id: 9, title: "The Family Dinner That Changed Everything", excerpt: "One ordinary dinner scene became the emotional heart of the entire series.", category: "Behind the Scenes", date: "June 25, 2026", readTime: "6 min", image: "https://picsum.photos/id/1005/900/600", content: "We cried while writing it. The actors cried while filming it. That’s how we knew it was real." },
            { id: 10, title: "When Spaces Become Characters", excerpt: "Treating the old family home as one of the most important characters in our story.", category: "Visual Storytelling", date: "June 22, 2026", readTime: "7 min", image: "https://picsum.photos/id/251/900/600", content: "The house remembers every betrayal, every forgiveness. We gave it a soul." },
            { id: 11, title: "The Philosophy of Unfinished Endings", excerpt: "Why we will never give you complete closure — and why that’s the point.", category: "Storytelling", date: "June 20, 2026", readTime: "9 min", image: "https://picsum.photos/id/29/900/600", content: "Closure is comforting. Longing is eternal. We choose longing every single time." },
            { id: 12, title: "When Actors Stopped Performing", excerpt: "The terrifying and beautiful moment the characters started living on their own.", category: "Behind the Scenes", date: "June 18, 2026", readTime: "5 min", image: "https://picsum.photos/id/160/900/600", content: "At some point the actors stopped acting and started living the characters. That’s when the real magic happened." },
            { id: 13, title: "Blending Two Cinematic Worlds", excerpt: "The challenges and beauty of merging Turkish poetry with South Asian emotional honesty.", category: "Culture", date: "June 15, 2026", readTime: "11 min", image: "https://picsum.photos/id/201/900/600", content: "It wasn’t about copying either style. It was about letting them argue beautifully until they found harmony." },
            { id: 14, title: "Writing Dialogue That Feels Stolen", excerpt: "How we make conversations feel like they were never meant to be heard out loud.", category: "Craft", date: "June 12, 2026", readTime: "8 min", image: "https://picsum.photos/id/1005/900/600", content: "The best lines are the ones characters are terrified to say. We make them say it anyway." },
            { id: 15, title: "Lighting as Emotional Language", excerpt: "Using light and shadow to communicate what words cannot express.", category: "Visual Storytelling", date: "June 10, 2026", readTime: "6 min", image: "https://picsum.photos/id/251/900/600", content: "Warm light for memory. Harsh light for confrontation. We let light do the heavy emotional lifting." },
            { id: 16, title: "The Stories We Almost Didn’t Tell", excerpt: "The episodes and scenes that were almost too personal to share.", category: "Behind the Scenes", date: "June 8, 2026", readTime: "7 min", image: "https://picsum.photos/id/29/900/600", content: "Some stories were too close to home. We told them anyway. Those became the most powerful ones." },
            { id: 17, title: "Creating Believable Family Tension", excerpt: "How we built relationships that feel lived-in, messy, and completely real.", category: "Craft", date: "June 5, 2026", readTime: "9 min", image: "https://picsum.photos/id/1005/900/600", content: "Real families are complicated. We stopped writing perfect families and started writing real ones." },
            { id: 18, title: "The Future of Unfinished Stories", excerpt: "Where Lumora is going and why we will never give complete closure.", category: "Storytelling", date: "June 3, 2026", readTime: "8 min", image: "https://picsum.photos/id/201/900/600", content: "Our stories will always leave something unfinished. Because life doesn’t finish." }
        ]

        function renderPosts(filtered) {
            const container = document.getElementById('posts-grid');
            container.innerHTML = '';

            filtered.forEach(post => {
                const card = document.createElement('div');
                card.className = `post-card bg-white border border-zinc-200 rounded-3xl overflow-hidden cursor-pointer`;
                
                card.innerHTML = `
                    <div class="relative overflow-hidden">
                        <img src="${post.image}" class="w-full h-56 object-cover" alt="">
                        <div class="absolute top-4 left-4">
                            <span class="px-3.5 py-1 text-xs font-semibold bg-white/95 rounded-full shadow-sm">${post.category}</span>
                        </div>
                    </div>
                    <div class="p-6">
                        <h3 class="font-semibold text-[21px] leading-tight tracking-tight mb-3">${post.title}</h3>
                        <p class="text-sm text-zinc-600 line-clamp-3 mb-5">${post.excerpt}</p>
                        
                        <div class="flex items-center justify-between text-xs text-zinc-500">
                            <span>${post.date}</span>
                            <span class="font-medium">${post.readTime}</span>
                        </div>
                    </div>
                `;
                card.onclick = () => {
                    alert(post.title + "\n\n" + post.content);
                };
                container.appendChild(card);
            });
        }

        function renderCategoryFilters() {
            const container = document.getElementById('category-filters');
            const categories = ['All', ...new Set(posts.map(p => p.category))];
            container.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `px-5 py-2 text-sm font-medium rounded-2xl border transition-all ${cat === 'All' ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white border-zinc-200'}`;
                btn.textContent = cat;
                btn.onclick = () => {
                    filterPosts(cat);
                    document.querySelectorAll('#category-filters button').forEach(b => {
                        b.classList.remove('bg-zinc-900', 'text-white', 'border-zinc-900');
                        if (b.textContent === cat) b.classList.add('bg-zinc-900', 'text-white', 'border-zinc-900');
                    });
                };
                container.appendChild(btn);
            });
        }

        function filterPosts(category) {
            let filtered = posts;
            if (category !== 'All') filtered = posts.filter(p => p.category === category);
            renderPosts(filtered);
        }

        function initializeSite() {
            renderCategoryFilters();
            renderPosts(posts);

            const input = document.getElementById('search-input');
            input.addEventListener('input', () => {
                const term = input.value.toLowerCase();
                const filtered = posts.filter(p => p.title.toLowerCase().includes(term) || p.excerpt.toLowerCase().includes(term));
                renderPosts(filtered);
            });

            console.log('%c[Lumora Journal] Clean version - Visual Storytelling tab removed.', 'color:#666');
        }

        window.onload = initializeSite;
    </script>
</body>
</html>
